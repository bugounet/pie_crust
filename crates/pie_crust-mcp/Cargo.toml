[package]
name = "pie_crust-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Authenticated local MCP transport for the pie_crust workbench"

[dependencies]
anyhow = "1"
axum = "0.8"
pie_crust-core = { path = "../pie_crust-core" }
rmcp = { version = "3.2", default-features = false, features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-util = "0.7"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"
