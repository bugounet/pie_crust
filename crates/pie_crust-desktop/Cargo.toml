[package]
name = "pie_crust-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native cross-platform pie_crust workbench"

[[bin]]
name = "crusty"
path = "src/main.rs"

[dependencies]
anyhow = "1"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "x11", "wayland"] }
egui_extras = { version = "0.36.2", default-features = false, features = ["syntect"] }
pulldown-cmark = "0.13"
pie_crust-core = { path = "../pie_crust-core" }
pie_crust-mcp = { path = "../pie_crust-mcp" }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.25"
regex = "1"
tempfile = "3"

[features]
default = ["renderer-wgpu"]
renderer-wgpu = ["eframe/wgpu"]
renderer-glow = ["eframe/glow"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30.13", default-features = false }
